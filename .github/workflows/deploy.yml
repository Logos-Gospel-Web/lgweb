name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6

      - name: Set up docker context over SSH authentication
        shell: sh
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 "$SSH_HOST" > ~/.ssh/known_hosts
          docker context create remote --docker "host=ssh://$SSH_USERNAME@$SSH_HOST"
          docker context use remote
        env:
          SSH_HOST: ${{ vars.WEB_DOMAIN }}
          SSH_USERNAME: ${{ vars.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy
        shell: sh
        run: |
          docker compose build --build-arg NAV_THRESHOLD=$NAV_THRESHOLD
          docker compose run --rm --no-deps cron ./server/migrations
          docker compose up -d --remove-orphans
        env:
          ALLOWED_HOSTS: "${{ vars.ALLOWED_HOSTS }}"
          SECRET_KEY: "${{ secrets.SECRET_KEY }}"
          CONTACT_EMAIL: "${{ vars.CONTACT_EMAIL }}"
          BREVO_API_KEY: "${{ secrets.BREVO_API_KEY }}"
          BREVO_SMTP_LOGIN: "${{ secrets.BREVO_SMTP_LOGIN }}"
          BREVO_SMTP_KEY: "${{ secrets.BREVO_SMTP_KEY }}"
          BREVO_PING_TARGET: "${{ secrets.BREVO_PING_TARGET }}"
          CONTACT_FORM_TEMPLATE_ID: "${{ vars.CONTACT_FORM_TEMPLATE_ID }}"
          CONTACT_FORM_RECIPIENTS: "${{ secrets.CONTACT_FORM_RECIPIENTS }}"
          S3_ENDPOINT_URL: "${{ secrets.S3_ENDPOINT_URL }}"
          S3_ACCESS_KEY_ID: "${{ secrets.S3_ACCESS_KEY_ID }}"
          S3_SECRET_ACCESS_KEY: "${{ secrets.S3_SECRET_ACCESS_KEY }}"
          S3_BUCKET_NAME: "${{ vars.S3_BUCKET_NAME }}"
          S3_BACKUP_BUCKET_NAME: "${{ vars.S3_BACKUP_BUCKET_NAME }}"
          S3_CUSTOM_DOMAIN: "${{ vars.S3_CUSTOM_DOMAIN }}"
          HEAD_INJECT: "${{ vars.HEAD_INJECT }}"
          GOATCOUNTER_HOSTNAME: "${{ vars.GOATCOUNTER_HOSTNAME }}"
          WEB_HOSTNAME: "https://www.${{ vars.WEB_DOMAIN }}"
          WEB_REDIR_HOSTNAME: "http://${{ vars.WEB_DOMAIN }}, https://${{ vars.WEB_DOMAIN }}, http://www.${{ vars.WEB_DOMAIN }}"
          WEB_REDIR_TARGET: "https://www.${{ vars.WEB_DOMAIN }}"
          NAV_THRESHOLD: "${{ vars.NAV_THRESHOLD }}"
          MAXMIND_LICENSE: "${{ secrets.MAXMIND_LICENSE }}"
          MEILI_MASTER_KEY: "${{ secrets.MEILI_MASTER_KEY }}"
          COMPOSE_PROJECT_NAME: lgweb
          COMPOSE_FILE: ./infrastructure/production/docker-compose.yml

      - name: Cleanup
        shell: sh
        run: |
          rm ~/.ssh/id_rsa
