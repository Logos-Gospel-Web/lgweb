volumes:
    caddy_data: {}
    db: {}
    reports: {}
    goatcounter_data: {}
    meili_data: {}
services:
    migrations:
        build: &build
            dockerfile: ./infrastructure/production/Dockerfile
            target: migrations
            context: ../..
        volumes: &volumes
            - db:/db/
            - reports:/reports/
    server:
        ports:
            - '8000:8000'
            - '8001:8001'
            - '8002:8002'
        build:
            <<: *build
            target: server
        environment:
            - MAIN_URL=main:8000
            - ADMIN_URL=admin:8000
            - GOATCOUNTER_URL=goatcounter:8080
            - WEB_HOSTNAME=:8000
            - WEB_REDIR_HOSTNAME=:8001
            - WEB_REDIR_TARGET=http://localhost:8000
            - GOATCOUNTER_HOSTNAME=:8002
        volumes:
            - caddy_data:/data/
    main: &main
        depends_on:
            migrations:
                condition: service_completed_successfully
        env_file:
            - .env
        environment:
            - PYTHONUNBUFFERED=1
            - ALLOWED_HOSTS=*
            - MEILI_URL=http://meilisearch:7700
            - MEILI_MASTER_KEY=qwertyuiop1234567890
        build:
            <<: *build
            target: main
        volumes: *volumes
    admin:
        <<: *main
        environment:
            - PYTHONUNBUFFERED=1
            - ALLOWED_HOSTS=*
            - MAIN_URL=main:8000
            - MEILI_URL=http://meilisearch:7700
            - MEILI_MASTER_KEY=qwertyuiop1234567890
    cron:
        <<: *main
        environment:
            - PYTHONUNBUFFERED=1
            - ALLOWED_HOSTS=*
            - MAIN_URL=main:8000
            - DRY_RUN=1
        build:
            <<: *build
            target: cron
    goatcounter:
        image: lgweb/goatcounter:latest
        volumes:
            - goatcounter_data:/home/goatcounter/goatcounter-data
        command:
            - serve
            - -automigrate
            - -ratelimit
            - export:1/1
    meilisearch:
        image: getmeili/meilisearch:v1.55.0
        ports:
            - '7700:7700'
        volumes:
            - meili_data:/meili_data
        environment:
            - MEILI_ENV=production
            - MEILI_MASTER_KEY=qwertyuiop1234567890
