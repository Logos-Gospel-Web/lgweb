services:
    server:
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
            - '443:443/udp'
        build: &build
            dockerfile: ./infrastructure/production/Dockerfile
            target: server
            context: ../..
        env_file:
            - .env.server
        environment:
            - MAIN_URL=main:8000
            - ADMIN_URL=admin:8000
            - GOATCOUNTER_URL=goatcounter:8080
        volumes:
            - /opt/lgweb/caddy_data/:/data/
    main: &main
        restart: unless-stopped
        env_file:
            - .env
        environment:
            - FORCE_HTTPS=1
            - INTERNAL_HOSTS=main
            - MEILI_URL=http://meilisearch:7700
            - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
        build:
            <<: *build
            target: main
        volumes:
            - /opt/lgweb/db/:/db/
            - /opt/lgweb/reports/:/reports/
        logging:
            driver: local
    admin:
        <<: *main
        environment:
            - FORCE_HTTPS=1
            - INTERNAL_HOSTS=admin
            - MAIN_URL=main:8000
            - MEILI_URL=http://meilisearch:7700
            - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
        deploy:
            resources:
                limits:
                    cpus: '0.5'
    cron:
        <<: *main
        build:
            <<: *build
            target: cron
        environment:
            - FORCE_HTTPS=1
            - INTERNAL_HOSTS=cron
            - MAIN_URL=main:8000
            - MEILI_URL=http://meilisearch:7700
            - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
        deploy:
            resources:
                limits:
                    cpus: '0.5'
    goatcounter:
        image: lgweb/goatcounter:latest
        volumes:
            - /opt/lgweb/goatcounter:/home/goatcounter/goatcounter-data
        command:
            - serve
            - -automigrate
            - -ratelimit
            - export:1/1
            - -geodb
            - ${MAXMIND_LICENSE}
    meilisearch:
        image: getmeili/meilisearch:v1.55.0
        volumes:
            - /opt/lgweb/meilisearch:/meili_data
        environment:
            - MEILI_ENV=production
            - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
