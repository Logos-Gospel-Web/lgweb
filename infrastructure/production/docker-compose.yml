x-app-env: &app-env
    FORCE_HTTPS: 1
    ALLOWED_HOSTS:
    SECRET_KEY:
    CONTACT_EMAIL:
    BREVO_API_KEY:
    BREVO_SMTP_LOGIN:
    BREVO_SMTP_KEY:
    BREVO_PING_TARGET:
    CONTACT_FORM_TEMPLATE_ID:
    CONTACT_FORM_RECIPIENTS:
    S3_ENDPOINT_URL:
    S3_ACCESS_KEY_ID:
    S3_SECRET_ACCESS_KEY:
    S3_BUCKET_NAME:
    S3_BACKUP_BUCKET_NAME:
    S3_CUSTOM_DOMAIN:
    HEAD_INJECT:
    GOATCOUNTER_HOSTNAME:
    MEILI_URL: http://meilisearch:7700
    MEILI_MASTER_KEY:

services:
    server:
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
            - '443:443/udp'
        image: ghcr.io/logos-gospel-web/lgweb-server:${IMAGE_TAG:-latest}
        environment:
            MAIN_URL: main:8000
            ADMIN_URL: admin:8000
            GOATCOUNTER_URL: goatcounter:8080
            WEB_HOSTNAME:
            WEB_REDIR_HOSTNAME:
            WEB_REDIR_TARGET:
            GOATCOUNTER_HOSTNAME:
        volumes:
            - /opt/lgweb/caddy_data/:/data/

    main: &main
        restart: unless-stopped
        environment:
            <<: *app-env
            INTERNAL_HOSTS: main
        image: ghcr.io/logos-gospel-web/lgweb-main:${IMAGE_TAG:-latest}
        volumes:
            - /opt/lgweb/db/:/db/
            - /opt/lgweb/reports/:/reports/
        logging:
            driver: local

    admin:
        <<: *main
        environment:
            <<: *app-env
            INTERNAL_HOSTS: admin
            MAIN_URL: main:8000
        deploy:
            resources:
                limits:
                    cpus: '0.5'

    cron:
        <<: *main
        image: ghcr.io/logos-gospel-web/lgweb-cron:${IMAGE_TAG:-latest}
        environment:
            <<: *app-env
            INTERNAL_HOSTS: cron
            MAIN_URL: main:8000
        deploy:
            resources:
                limits:
                    cpus: '0.5'

    goatcounter:
        image: ghcr.io/logos-gospel-web/goatcounter:latest
        volumes:
            - /opt/lgweb/goatcounter:/home/goatcounter/goatcounter-data
        command:
            - serve
            - -automigrate
            - -ratelimit
            - export:1/1
            - -geodb
            - ${MAXMIND_LICENSE}

    meilisearch:
        image: getmeili/meilisearch:v1.55.0
        volumes:
            - /opt/lgweb/meilisearch:/meili_data
        environment:
            MEILI_ENV: production
            MEILI_MASTER_KEY:
