x-env: &env
    ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    SECRET_KEY: ${SECRET_KEY}
    CONTACT_EMAIL: ${CONTACT_EMAIL}
    BREVO_API_KEY: ${BREVO_API_KEY}
    BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN}
    BREVO_SMTP_KEY: ${BREVO_SMTP_KEY}
    BREVO_PING_TARGET: ${BREVO_PING_TARGET}
    CONTACT_FORM_TEMPLATE_ID: ${CONTACT_FORM_TEMPLATE_ID}
    CONTACT_FORM_RECIPIENTS: ${CONTACT_FORM_RECIPIENTS}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    S3_BACKUP_BUCKET_NAME: ${S3_BACKUP_BUCKET_NAME}
    S3_CUSTOM_DOMAIN: ${S3_CUSTOM_DOMAIN}
    HEAD_INJECT: ${HEAD_INJECT}
    GOATCOUNTER_HOSTNAME: ${GOATCOUNTER_HOSTNAME}

services:
    server:
        environment:
            WEB_HOSTNAME: ${WEB_HOSTNAME}
            WEB_REDIR_HOSTNAME: ${WEB_REDIR_HOSTNAME}
            WEB_REDIR_TARGET: ${WEB_REDIR_TARGET}
            GOATCOUNTER_HOSTNAME: ${GOATCOUNTER_HOSTNAME}

    main:
        environment:
            <<: *env

    admin:
        environment:
            <<: *env

    cron:
        environment:
            <<: *env
